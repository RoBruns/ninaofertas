# Config do serviço nina-api na Railway (config-as-code por serviço).
# No serviço: Settings → Config-as-code → caminho "deploy/railway.api.toml".
# Sem isso, o serviço herdaria o railway.toml da raiz e subiria um SEGUNDO bot.

[build]
builder = "NIXPACKS"

[deploy]
# Migrations são aditivas (docs/DATABASE.md). Rodam antes de cada deploy da API.
preDeployCommand = "alembic upgrade head"
# api.serve abre um unico socket dual-stack: rede interna IPv6 + healthcheck IPv4.
# --proxy-headers/--forwarded-allow-ips=* → a API só é acessível pelo proxy do dashboard
#   (sem domínio público), então confia no X-Forwarded-For para o IP real do
#   cliente — sem isso o rate limit de login seria global e a auditoria gravaria
#   sempre o IP do proxy.
startCommand = "python -m api.serve"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
