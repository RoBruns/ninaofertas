[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ninaofertas"
version = "0.1.0"
description = "Worker de captura e publicação de ofertas"
requires-python = ">=3.10"
dependencies = [
    "apscheduler",
    "beautifulsoup4",
    "httpx",
    "loguru",
    "lxml",
    "pillow",
    "psycopg[binary]",
    "python-dotenv",
    "sqlalchemy",
]

[project.optional-dependencies]
dev = ["black", "pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["core*", "worker*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
