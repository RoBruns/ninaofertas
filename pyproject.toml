[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ninaofertas"
version = "0.1.0"
description = "Worker de captura e publicação de ofertas"
requires-python = ">=3.10"
dependencies = [
    "alembic",
    "apscheduler",
    "argon2-cffi",
    "beautifulsoup4",
    "cryptography",
    "fastapi",
    "httpx",
    "loguru",
    "lxml",
    "pillow",
    "psycopg[binary]",
    "PyJWT",
    "python-multipart",
    "python-dotenv",
    "sqlalchemy",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["black", "pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["api*", "core*", "worker*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"worker/filters.py" = ["E741"]
"worker/monitor.py" = ["E741"]
"worker/sources/cupons.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
